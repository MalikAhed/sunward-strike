name: Build, test and publish Sunward

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Install offline shader compiler runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri
      - run: npm test
        env:
          REQUIRE_SHADER_COMPILER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Verify editable-source package
        run: |
          python3 -m unittest discover -s source-assets/map-v32 -p 'test_*.py'
          python3 source-assets/map-v32/extract_source.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
